name: Build and Release Installers

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            build_cmd: npm run build:win
          - os: ubuntu-latest
            target: Linux
            build_cmd: npm run build:linux
          - os: macos-latest
            target: macOS
            build_cmd: npm run build:mac

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências do Sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libnotify-bin

      - name: Instalar Dependências do Projeto
        run: npm ci

      - name: Compilar Instalador Local
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fazer Upload dos Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar Release no GitHub
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar todos os instaladores compilados
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organizar Arquivos para Release
        run: |
          mkdir -p final-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Criar ou Atualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Conversor de Documentos - Versão Mais Recente' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
