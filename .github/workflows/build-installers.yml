name: Build and Release Installers

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            build_cmd: npm run build:win
          - os: ubuntu-latest
            target: Linux
            build_cmd: npm run build:linux
          - os: macos-latest
            target: macOS
            build_cmd: npm run build:mac

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências do Sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libnotify-bin

      - name: Instalar Dependências do Projeto
        run: npm ci

      - name: Compilar Instalador Local
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fazer Upload dos Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar Release no GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar Tag e Título da Release
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            TAG="v${PKG_VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=Conversor de Documentos ${TAG}" >> $GITHUB_OUTPUT

      - name: Baixar todos os instaladores compilados
        uses: actions/download-artifact@v4
        with:
          pattern: 'Instaladores-*'
          path: final-release
          merge-multiple: true

      - name: Listar Arquivos para Release
        run: |
          ls -la final-release/

      - name: Criar ou Atualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          append_body: false
          files: |
            final-release/*.exe
            final-release/*.AppImage
            final-release/*.deb
            final-release/*.dmg
            final-release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
